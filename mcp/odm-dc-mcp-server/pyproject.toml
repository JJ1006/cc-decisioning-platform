[project]
name = "odm-dc-mcp-server"
version = "0.1.0"
description = "MCP server for Maple Northern Bank: read-only access to ODM Decision Center, decisions and statistics; PII-masked, audited"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.12,<2",
    "httpx>=0.28,<1",
    "presidio-analyzer>=2.2.358,<3",
    "presidio-anonymizer>=2.2.358,<3",
    "spacy>=3.8,<4",
    "confluent-kafka>=2.8,<3",
    "cryptography>=50",
    "uvicorn>=0.34",
]

[project.scripts]
odm-dc-mcp = "odm_dc_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.22",
    "ruff>=0.9",
    "mypy>=1.14",
    "jsonschema>=4.23",
    "referencing>=0.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odm_dc_mcp"]

[tool.ruff]
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
