name: images
# Multi-arch (amd64 + arm64) images of the services to GHCR: ghcr.io/jj1006/cc-<service>:<commit sha>, plus the semver tag on a release.
# Every image is signed with cosign (keyless, GitHub OIDC - no key to keep) and carries a Syft SBOM (SPDX) as a cosign attestation.
#   verify: cosign verify ghcr.io/jj1006/cc-txn-generator:<tag> --certificate-identity-regexp 'https://github.com/JJ1006/cc-decisioning-platform/.*' \
#             --certificate-oidc-issuer https://token.actions.githubusercontent.com
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['services/**', 'mcp/odm-dc-mcp-server/**', 'contracts/**', 'rules/xom/**', 'pom.xml', '.github/workflows/images.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the SBOM to the GitHub release
      packages: write
      id-token: write # cosign keyless
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: txn-generator, dockerfile: services/txn-generator/Dockerfile }
          - { service: decision-orchestrator, dockerfile: services/decision-orchestrator/Dockerfile }
          - { service: notification-svc, dockerfile: services/notification-svc/Dockerfile }
          - { service: decision-query-api, dockerfile: services/decision-query-api/Dockerfile }
          - { service: application-api, dockerfile: services/application-api/Dockerfile }
          - { service: odm-dc-mcp, dockerfile: mcp/odm-dc-mcp-server/Dockerfile }
    env:
      IMAGE: ghcr.io/jj1006/cc-${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan the pushed image (fixable HIGH and CRITICAL fail the build; accepted findings are in .trivyignore with an expiry)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: { syft-version: v1.55.0 }
      - name: Sign, generate the SBOM and attest it (by digest)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          syft "${IMAGE}@${DIGEST}" -o spdx-json=sbom.spdx.json
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: 'sbom-${{ matrix.service }}', path: sbom.spdx.json }
      - name: Attach the SBOM to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp sbom.spdx.json "sbom-${{ matrix.service }}-${GITHUB_REF_NAME}.spdx.json"
          gh release upload "$GITHUB_REF_NAME" "sbom-${{ matrix.service }}-${GITHUB_REF_NAME}.spdx.json" --clobber
