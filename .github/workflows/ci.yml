name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Validate contracts
        run: |
          pip install --quiet jsonschema
          python scripts/validate-contracts.py
      - name: Maven verify (skipped when no modules)
        run: |
          if grep -q '<module>' pom.xml; then mvn -B -ntp verify; else echo "no modules yet"; fi
      - name: Prohibited-grounds lint
        run: |
          if [ -x scripts/lint-prohibited-grounds.sh ]; then scripts/lint-prohibited-grounds.sh; else echo "lint not added yet"; fi
