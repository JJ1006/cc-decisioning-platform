name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-python@v7
        with: { python-version: '3.13' }
      - name: Validate contracts
        run: |
          pip install --quiet jsonschema
          python scripts/validate-contracts.py
      - name: Maven verify (skipped when no modules)
        run: |
          if grep -q '<module>' pom.xml; then mvn -B -ntp verify; else echo "no modules yet"; fi
      - name: OpenAPI lint (Spectral); drift of docs/api/*.yaml is checked by the OpenApiContractTest in Maven verify
        run: npx --yes @stoplight/spectral-cli@6.15.0 lint docs/api/*.yaml --fail-severity=error
      - name: MCP server (ruff, mypy, pytest)
        run: |
          pip install --quiet uv
          REQUIRE_UV=1 scripts/test-mcp.sh
      - name: Observability config (dashboards, Prometheus rules, Alertmanager, collector, runbooks)
        run: REQUIRE_DOCKER=1 scripts/lint-observability.sh
      - name: Logstash pipeline tests (PII masking, dead letters, log parsing)
        run: REQUIRE_DOCKER=1 scripts/test-logstash.sh
      - name: Prohibited-grounds lint
        run: |
          if [ -x scripts/lint-prohibited-grounds.sh ]; then scripts/lint-prohibited-grounds.sh; else echo "lint not added yet"; fi
      - name: Rules scenarios match the written spec
        run: python3 rules/tests/check_scenarios.py
