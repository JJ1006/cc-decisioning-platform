name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch: # bot pull requests (GITHUB_TOKEN) start no workflows: bump-kind, promote and release start this one on their branch so the required check `ci` exists
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: { python-version: '3.13' }
      - name: Validate contracts
        run: |
          pip install --quiet jsonschema==4.26.0
          python scripts/validate-contracts.py
      - name: Maven verify (skipped when no modules)
        run: |
          if grep -q '<module>' pom.xml; then mvn -B -ntp verify; else echo "no modules yet"; fi
      - name: OpenAPI lint (Spectral); drift of docs/api/*.yaml is checked by the OpenApiContractTest in Maven verify
        run: npx --yes @stoplight/spectral-cli@6.15.0 lint docs/api/*.yaml --fail-severity=error
      - name: MCP server (ruff, mypy, pytest)
        run: |
          pip install --quiet uv==0.13.5
          REQUIRE_UV=1 scripts/test-mcp.sh
      - name: Observability config (dashboards, Prometheus rules, Alertmanager, collector, runbooks)
        run: REQUIRE_DOCKER=1 scripts/lint-observability.sh
      - name: Logstash pipeline tests (PII masking, dead letters, log parsing)
        run: REQUIRE_DOCKER=1 scripts/test-logstash.sh
      - name: Prohibited-grounds lint (and proof that it fails on a planted violation)
        run: |
          scripts/lint-prohibited-grounds.sh
          scripts/test-lint-prohibited-grounds.sh
      - name: Generated files are current (rules catalog resource of the explanation endpoint)
        run: python3 scripts/gen-rules-catalog.py --check
      - name: Rules scenarios match the written spec
        run: python3 rules/tests/check_scenarios.py
