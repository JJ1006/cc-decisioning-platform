name: rules-gate
# The rule regression gate (docs/evals.md). On a pull request that touches the rules, the rules catalog or the golden dataset it starts ODM for Developers
# (amd64 container, public image, licence accepted by running it), deploys the rules from git through Decision Center, runs the 300 golden cases against
# RES and fails on ANY difference from the oracle labels. The report is uploaded as an artifact and summarised in a comment on the pull request.
#
# The job always runs and passes at once when no gated path changed: a required status check that only runs for some paths would block every other
# pull request ("Expected - waiting for status"). Make it required for everything (see docs/evals.md, branch protection):
#   gh api -X PATCH repos/<owner>/<repo>/branches/main/protection/required_status_checks -f strict=true -f 'contexts[]=ci' -f 'contexts[]=rules-gate'
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  rules-gate:
    name: rules-gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - name: Did a gated path change?
        id: scope
        run: |
          if [[ "${{ github.event_name }}" == workflow_dispatch ]]; then echo "run=true" >>"$GITHUB_OUTPUT"; exit 0; fi
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          echo "$changed"
          if grep -E '^(rules/|docs/rules-catalog\.md|evals/golden/|evals/rule-regression/|scripts/deploy-dc\.sh|scripts/gen_dc_project\.py|\.github/workflows/rules-gate\.yml)' <<<"$changed" >/dev/null; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "No rules, catalog or golden change: nothing to gate."
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        if: steps.scope.outputs.run == 'true'
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: steps.scope.outputs.run == 'true'
        with: { python-version: '3.13' }
      - name: Oracle tests and the golden file is current
        if: steps.scope.outputs.run == 'true'
        run: |
          pip install --quiet pytest==9.1.1
          python -m pytest evals/golden -q
          python evals/golden/generate.py --check
          python rules/tests/check_scenarios.py
          scripts/lint-prohibited-grounds.sh
      - name: Start ODM for Developers (amd64) with the demo certificates
        if: steps.scope.outputs.run == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends jq >/dev/null
          scripts/pki.sh
          docker pull icr.io/cpopen/odm-k8s/odm:9.5.0.1-IF019_25.1.0
          PROFILE=core scripts/compose.sh up -d odm
          for i in $(seq 1 90); do
            [[ "$(docker inspect -f '{{.State.Health.Status}}' ccplatform-odm-1 2>/dev/null)" == healthy ]] && break
            sleep 10
          done
          docker inspect -f '{{.State.Health.Status}}' ccplatform-odm-1 | grep -qx healthy
      - name: Deploy the rules from git (Decision Center build, 0 errors)
        if: steps.scope.outputs.run == 'true'
        run: make deploy-rules
      - name: Rule regression (any difference fails)
        if: steps.scope.outputs.run == 'true'
        id: gate
        run: python3 evals/rule-regression/run.py
      - name: Upload the report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rule-regression-report
          path: evals/rule-regression/out/
          if-no-files-found: warn
      - name: Comment the summary on the pull request
        if: always() && steps.scope.outputs.run == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=evals/rule-regression/out/report.md
          [[ -f "$f" ]] || { echo "no report"; exit 0; }
          { echo "<!-- rules-gate -->"; head -c 3500 "$f"; echo; echo "Full report: artifact **rule-regression-report** of this run."; } >body.md
          id=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --jq '[.[] | select(.body | startswith("<!-- rules-gate -->"))][0].id // empty')
          if [[ -n "$id" ]]; then gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@body.md >/dev/null
          else gh pr comment ${{ github.event.pull_request.number }} --body-file body.md; fi
      - name: Container log on failure
        if: failure() && steps.scope.outputs.run == 'true'
        run: docker logs --tail 80 ccplatform-odm-1 || true
