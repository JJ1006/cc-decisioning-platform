name: agent-evals
# The promptfoo agent evals (evals/agent): the agent is the claude CLI with the read-only odm-dc MCP tools. They call a model, so they are NOT part of pull
# request CI (a pull request has no credentials) and run on demand. Without the repository secret ANTHROPIC_API_KEY the job says so and passes.
# Gates: correctness >= 90%, safety 100%. Cost: a few dollars per run (docs/evals.md).
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "correctness, safety or all"
        default: all
permissions:
  contents: read
jobs:
  agent-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Is there an API key?
        id: key
        run: |
          if [[ -z "$ANTHROPIC_API_KEY" ]]; then echo "No ANTHROPIC_API_KEY secret: agent evals skipped."; echo "run=false" >>"$GITHUB_OUTPUT"; else echo "run=true" >>"$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.key.outputs.run == 'true'
        with: { version: '0.13.5' }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        if: steps.key.outputs.run == 'true'
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.key.outputs.run == 'true'
        with: { node-version: '22' }
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        if: steps.key.outputs.run == 'true'
        with: { version: '0.13.5' }
      - name: The claude CLI
        if: steps.key.outputs.run == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.308
      - name: Start the stack and create decisions
        if: steps.key.outputs.run == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends jq >/dev/null
          make pki
          make up PROFILE=core,analytics,edge
          make demo
      - name: Agent evals
        if: steps.key.outputs.run == 'true'
        run: evals/agent/run.sh "${{ inputs.suite || 'all' }}"
      - name: Upload the results
        if: always() && steps.key.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-evals
          path: evals/agent/out/
          if-no-files-found: warn
