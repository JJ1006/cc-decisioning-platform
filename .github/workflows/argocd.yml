name: argocd
# GitOps manifests (deploy/argocd) and what they render:
#   lint           kustomize builds, kubeconform --strict on Application / AppProject, the policy per environment (pinned revisions, sync mode,
#                  waves, project restrictions) and a helm render + kubeconform of every application with its value files: scripts/lint-argocd.sh
#   argocd-smoke   make argocd-up ENV=kind-lite on the pull request's branch, then deploy the rules and run the demo. Manual (workflow_dispatch) or
#                  on a pull request labelled `argocd-smoke`; images come from GHCR (no build), about 20 minutes.
on:
  pull_request:
    paths: ['deploy/argocd/**', 'deploy/helm/**', 'scripts/lint-argocd.sh', 'scripts/argocd*.sh', '.github/workflows/argocd.yml']
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths: ['deploy/argocd/**', 'deploy/helm/**', 'scripts/lint-argocd.sh', '.github/workflows/argocd.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'labeled'
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with: { version: v4.1.1 }
      - name: kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin kubeconform
      - run: REQUIRE_ARGOCD_TOOLS=1 scripts/lint-argocd.sh
      - uses: actions/upload-artifact@v4
        with: { name: argocd-rendered, path: out/argocd-lint/ }
  argocd-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'argocd-smoke'))
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: azure/setup-helm@v4
        with: { version: v4.1.1 }
      - uses: helm/kind-action@v1
        with: { install_only: true }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - run: docker pull icr.io/cpopen/odm-k8s/odm:9.5.0.1-IF019_25.1.0
      - name: Argo CD installs everything from the branch
        env:
          REVISION: ${{ github.head_ref || github.ref_name }}
        run: make argocd-up ENV=kind-lite
      - run: make kind-deploy-rules
      - name: "Demo (decisions > 0)"
        run: make kind-demo
      - name: Applications and pods on failure
        if: failure()
        run: |
          kubectl --context kind-cc -n argocd get applications -o wide || true
          kubectl --context kind-cc -n argocd describe applications | grep -B2 -A12 "Message\|Conditions" | tail -150 || true
          kubectl --context kind-cc get pods -A || true
