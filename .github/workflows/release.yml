name: release
on:
  push: { branches: [main] }
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # tags and releases made with GITHUB_TOKEN do not start other workflows, so start the image build for the tag and the promotion pull request here
      - name: Images and promotion for the release
        if: steps.rp.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # no checkout in this job: gh needs the repository named
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          gh workflow run images.yml --ref "$TAG"
          gh workflow run promote.yml --ref main --field tag="$TAG"
      # the release-please pull request (created or updated) is pushed with GITHUB_TOKEN, so its pull_request workflows do not start (or start held) and main requires
      # ci and rules-gate on its head commit: start both with workflow_dispatch (allowed for GITHUB_TOKEN), which attaches them to that commit
      - name: Start the required checks on the release pull request
        if: steps.rp.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.rp.outputs.pr }}
        run: |
          branch=$(jq -r '.headBranchName' <<<"$PR_JSON")
          gh workflow run ci.yml --ref "$branch"
          gh workflow run rules-gate.yml --ref "$branch"
