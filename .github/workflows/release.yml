name: release
on:
  push: { branches: [main] }
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # tags and releases made with GITHUB_TOKEN do not start other workflows, so start the image build for the tag and the promotion pull request here
      - name: Images and promotion for the release
        if: steps.rp.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: |
          gh workflow run images.yml --ref "$TAG"
          gh workflow run promote.yml --ref main --field tag="$TAG"
      # the release-please pull request starts its workflows held (action_required) and main requires ci: release them
      - name: Release the held workflow runs of the release pull request
        if: steps.rp.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.rp.outputs.pr).headBranchName }}
        run: |
          sleep 20
          for id in $(gh run list --branch "$BRANCH" --event pull_request --status action_required --json databaseId -q '.[].databaseId'); do
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/$id/approve" || true
          done
