version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0 # PAUSED - remove limit to re-enable
    groups:
      maven-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: [version-update:semver-major]
      - dependency-name: "com.networknt:*"
        update-types: [version-update:semver-major]
      - dependency-name: "net.logstash.logback:*"
        update-types: [version-update:semver-major]
  - package-ecosystem: pip # mcp/odm-dc-mcp-server (uv.lock); paused like the others
    directory: /mcp/odm-dc-mcp-server
    schedule: { interval: weekly }
    open-pull-requests-limit: 0 # PAUSED - remove limit to re-enable
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 0 # PAUSED - remove limit to re-enable
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: /deploy/compose
    schedule: { interval: weekly }
    open-pull-requests-limit: 0 # PAUSED - remove limit to re-enable
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
