spring:
  application:
    name: decision-orchestrator
  main:
    banner-mode: off
server:
  port: 8080
  tomcat:
    threads:
      max: 10
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
platform:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9093}
    keystore: ${KAFKA_KEYSTORE:}
    truststore: ${KAFKA_TRUSTSTORE:}
    store-password: ${KAFKA_STORE_PASSWORD:}
    group-id: decision-orchestrator
    transactional-id-prefix: ${TX_ID_PREFIX:orchestrator-tx-}
    concurrency: 1
res:
  base-url: ${RES_BASE_URL:https://localhost:9443}
  path: ${RES_PATH:/DecisionService/rest/ccApprovalApp/1.0/ccApproval/1.0}
  username: ${RES_USERNAME:}
  password: ${RES_PASSWORD:}
  truststore: ${RES_TRUSTSTORE:}
  truststore-password: ${RES_TRUSTSTORE_PASSWORD:}
logging:
  config: classpath:logback-spring.xml
