spring:
  application:
    name: decision-query-api
  main:
    banner-mode: off
server:
  port: 8080
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false} # compose switches it on: mutual TLS, only the listed client CNs may call
    key-store: ${SERVER_KEYSTORE:}
    key-store-type: PKCS12
    key-store-password: ${KEYSTORE_PASSWORD:}
    trust-store: ${SERVER_TRUSTSTORE:}
    trust-store-type: PKCS12
    trust-store-password: ${TRUSTSTORE_PASSWORD:}
    client-auth: need
  tomcat:
    threads:
      max: 10
management:
  server:
    port: ${MANAGEMENT_PORT:} # compose sets 9090: plain http for probes and metrics, never published
    ssl:
      enabled: false # the management port does not inherit the mutual TLS of the service port
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  health:
    elasticsearch:
      enabled: false # needs cluster privileges; SearchHealthIndicator searches instead
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
springdoc:
  writer-with-order-by-keys: true # same output on every JVM and OS: CI compares it with the committed file
  swagger-ui:
    enabled: false
  api-docs:
    version: openapi_3_0
es:
  url: ${ES_URL:https://localhost:9200}
  ca: ${ES_CA:}
  username: ${ES_USERNAME:decision-query-api}
  password: ${QUERY_API_PASSWORD:}
platform:
  security:
    require-client-cert: ${SERVER_SSL_ENABLED:false}
    allowed-client-cns: apisix,application-api
    gateway-cn: apisix
logging:
  config: classpath:logback-spring.xml
