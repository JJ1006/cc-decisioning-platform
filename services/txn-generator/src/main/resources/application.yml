spring:
  application:
    name: txn-generator
  main:
    banner-mode: off
server:
  port: 8080
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false} # compose switches it on: mutual TLS, only the listed client CNs may call
    key-store: ${SERVER_KEYSTORE:}
    key-store-type: PKCS12
    key-store-password: ${KEYSTORE_PASSWORD:}
    trust-store: ${SERVER_TRUSTSTORE:}
    trust-store-type: PKCS12
    trust-store-password: ${TRUSTSTORE_PASSWORD:}
    client-auth: need
  tomcat:
    threads:
      max: 10
management:
  server:
    port: ${MANAGEMENT_PORT:} # compose sets 9090: plain http for probes and metrics, never published
    ssl:
      enabled: false # the management port does not inherit the mutual TLS of the service port
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
platform:
  security:
    require-client-cert: ${SERVER_SSL_ENABLED:false}
    allowed-client-cns: apisix
    gateway-cn: apisix
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9093}
    keystore: ${KAFKA_KEYSTORE:}
    truststore: ${KAFKA_TRUSTSTORE:}
    store-password: ${KAFKA_STORE_PASSWORD:}
    truststore-password: ${KAFKA_TRUSTSTORE_PASSWORD:} # blank: same as store-password (Strimzi issues two)
logging:
  config: classpath:logback-spring.xml
