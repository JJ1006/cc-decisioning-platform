spring:
  application:
    name: application-api
  main:
    banner-mode: off
server:
  port: 8080
  tomcat:
    threads:
      max: 10
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
springdoc:
  writer-with-order-by-keys: true # same output on every JVM and OS: CI compares it with the committed file
  swagger-ui:
    enabled: false
  api-docs:
    version: openapi_3_0
platform:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9093}
    keystore: ${KAFKA_KEYSTORE:}
    truststore: ${KAFKA_TRUSTSTORE:}
    store-password: ${KAFKA_STORE_PASSWORD:}
    group-id: application-api
    transactional-id-prefix: ${TX_ID_PREFIX:application-api-tx-}
api:
  query-url: ${QUERY_API_URL:http://localhost:8085}
  idempotency-ttl-hours: 24
  idempotency-max-entries: 10000
logging:
  config: classpath:logback-spring.xml
