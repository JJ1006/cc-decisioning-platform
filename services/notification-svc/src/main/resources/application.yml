spring:
  application:
    name: notification-svc
  main:
    banner-mode: off
server:
  port: 8080
  tomcat:
    threads:
      max: 10
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
platform:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9093}
    keystore: ${KAFKA_KEYSTORE:}
    truststore: ${KAFKA_TRUSTSTORE:}
    store-password: ${KAFKA_STORE_PASSWORD:}
    group-id: notification-svc
logging:
  config: classpath:logback-spring.xml
