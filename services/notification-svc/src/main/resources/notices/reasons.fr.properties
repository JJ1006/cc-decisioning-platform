# Motifs en français (texte écrit à la main, à faire relire par un locuteur natif avant tout usage réel; aucune traduction automatique).
# One entry per ReasonCode; NoticeTemplatesTest fails when one is missing.
R_AGE_BELOW_MAJORITY=Le demandeur n'a pas atteint l'âge de la majorité dans sa province
R_NON_RESIDENT=Le demandeur n'est ni résident du Canada ni titulaire d'un permis valide
R_ACTIVE_BANKRUPTCY=Le demandeur fait l'objet d'une faillite active
R_LOW_SCORE=La cote de crédit est inférieure au minimum exigé
R_HIGH_TDS=Le ratio du service de la dette totale est trop élevé
R_INSUFFICIENT_INCOME=Le revenu est inférieur au minimum exigé pour ce produit
R_DELINQUENCIES=Retards de paiement récents au dossier de crédit
R_EXCESSIVE_INQUIRIES=Trop de demandes de crédit récentes
R_THIN_FILE=Le dossier de crédit est trop court pour être évalué
R_BORDERLINE_SCORE=La cote de crédit est limite et exige un examen manuel
R_BORDERLINE_TDS=Le ratio du service de la dette est limite et exige un examen manuel
R_APPROVED_STANDARD=Répond aux critères d'approbation standard
