spring:
  application:
    name: es-indexer
  main:
    banner-mode: off
server:
  port: 8080
  tomcat:
    threads:
      max: 10
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
platform:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9093}
    keystore: ${KAFKA_KEYSTORE:}
    truststore: ${KAFKA_TRUSTSTORE:}
    store-password: ${KAFKA_STORE_PASSWORD:}
    group-id: es-indexer
    max-poll-records: 200
es:
  url: ${ES_URL:https://localhost:9200}
  username: ${ES_USERNAME:es-indexer}
  password: ${ES_INDEXER_PASSWORD:}
  truststore: ${ES_TRUSTSTORE:}
  truststore-password: ${ES_TRUSTSTORE_PASSWORD:}
logging:
  config: classpath:logback-spring.xml
