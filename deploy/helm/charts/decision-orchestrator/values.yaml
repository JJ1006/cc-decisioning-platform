# decision-orchestrator: consume-transform-produce between Kafka and ODM RES (mutual TLS + basic auth). mem_limit 384m in compose.
image:
  repository: jj1006/cc-decision-orchestrator
  pullPolicy: IfNotPresent
replicas: 1 # scale up to the partition count (3) of cc.applications.submitted.v1
port: 8080 # plain http: probes and metrics only, no API
tls: false
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 384Mi }
env:
  RES_BASE_URL: https://odm:9453
  RES_TRUSTSTORE: /pki/truststore.p12
  RES_KEYSTORE: /pki/keystore.p12 # client certificate for ODM (mutual TLS)
secretEnv: # the ODM for Developers demo user; created by scripts/k8s-secrets.sh
  - { name: RES_USERNAME, secret: cc-odm-credentials, key: RES_USERNAME }
  - { name: RES_PASSWORD, secret: cc-odm-credentials, key: RES_PASSWORD }
pkiPasswordEnv: [RES_KEYSTORE_PASSWORD, RES_TRUSTSTORE_PASSWORD]
pki: { enabled: true, format: pkcs12 }
kafka: { enabled: true }
otel: { enabled: true }
hpa: { enabled: false }
pdb: { enabled: false }
serviceMonitor: { enabled: false }
networkPolicy:
  enabled: true
  allowPrometheus: true
  ingress: []
  egress:
    - to: [{ podSelector: { matchLabels: { strimzi.io/cluster: cc, strimzi.io/kind: Kafka } } }]
      ports: [{ port: 9093, protocol: TCP }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: odm } } }]
      ports: [{ port: 9453, protocol: TCP }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: otel-collector } } }]
      ports: [{ port: 4318, protocol: TCP }]
