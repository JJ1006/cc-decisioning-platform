apiVersion: v2
name: cc-observability
description: Metrics, traces, alerts and dashboards of the cc-platform - kube-prometheus-stack, Tempo and the OpenTelemetry Collector with the same dashboards, rules and collector pipeline as the compose obs profile
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: kube-prometheus-stack
    version: 92.10.1
    repository: https://prometheus-community.github.io/helm-charts
    condition: kube-prometheus-stack.enabled
  - name: tempo
    version: 1.24.4
    repository: https://grafana.github.io/helm-charts
    condition: tempo.enabled
  - name: opentelemetry-collector
    version: 0.176.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: opentelemetry-collector.enabled
