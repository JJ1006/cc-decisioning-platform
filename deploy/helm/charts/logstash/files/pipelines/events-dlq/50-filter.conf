filter {
  ruby {
    id => "es-reject-transform"
    path => "/usr/share/logstash/ruby/cc_es_reject.rb"
  }
  prune {
    whitelist_names => [
      "^@timestamp$", "^eventId$", "^correlationId$", "^source$", "^originalTopic$", "^originalValue$",
      "^errorClass$", "^errorMessage$", "^failedAt$", "^topic$"
    ]
  }
}
