# Parse the envelope, mask personal data, choose the write alias. Unreadable messages become cc-dlq documents.
# The logic is in ruby/cc_events.rb so scripts/test-logstash.sh can test it.
filter {
  ruby {
    id => "events-transform"
    path => "/usr/share/logstash/ruby/cc_events.rb"
  }
  prune {
    # only fields the strict templates know: the event envelope plus topic, or the dlq document
    whitelist_names => [
      "^@timestamp$", "^eventId$", "^correlationId$", "^eventType$", "^schemaVersion$", "^occurredAt$",
      "^producer$", "^topic$", "^decisionSource$", "^payload$", "^source$", "^originalTopic$", "^originalValue$",
      "^errorClass$", "^errorMessage$", "^failedAt$"
    ]
  }
}
