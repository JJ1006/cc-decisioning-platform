# decision-query-api: read-only API on the cc-* aliases of Elasticsearch. mem_limit 384m in compose.
image:
  repository: jj1006/cc-decision-query-api
  pullPolicy: IfNotPresent
replicas: 1
port: 8080 # mutual TLS: CN=apisix and CN=application-api may call
tls: true
managementPort: 9090
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: "1", memory: 384Mi }
env:
  SERVER_SSL_ENABLED: "true"
  SERVER_KEYSTORE: /pki/keystore.p12
  SERVER_TRUSTSTORE: /pki/truststore.p12
  MANAGEMENT_PORT: "9090"
  ES_URL: https://cc-es-http:9200
  ES_CA: /pki/ca.crt # ECK serves the HTTP certificate cert-manager issued from the platform CA
secretEnv:
  - { name: QUERY_API_PASSWORD, secret: cc-es-passwords, key: QUERY_API_PASSWORD }
pkiPasswordEnv: [KEYSTORE_PASSWORD, TRUSTSTORE_PASSWORD]
pki: { enabled: true, format: pkcs12 }
kafka: { enabled: false }
otel: { enabled: true }
hpa: { enabled: false, minReplicas: 1, maxReplicas: 3, cpu: 80 }
pdb: { enabled: false }
serviceMonitor: { enabled: false }
networkPolicy:
  enabled: true
  allowPrometheus: true
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: apisix } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: application-api } }
      ports: [8080]
  egress:
    - to: [{ podSelector: { matchLabels: { common.k8s.elastic.co/type: elasticsearch } } }]
      ports: [{ port: 9200, protocol: TCP }]
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: otel-collector } } }]
      ports: [{ port: 4318, protocol: TCP }]
