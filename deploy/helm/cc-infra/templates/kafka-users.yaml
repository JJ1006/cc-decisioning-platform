{{- if .Values.kafka.enabled }}
{{- /* one KafkaUser per client, ACLs generated from docs/security-mtls.md by scripts/gen-k8s-kafka.py; the principal is CN=<name> */ -}}
{{- $k := .Files.Get "files/kafka.yaml" | fromYaml }}
{{- range $k.users }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ .name }}
  labels:
    strimzi.io/cluster: {{ $.Values.kafka.name }}
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      {{- range .acls }}
      - resource:
          type: {{ .type }}
          name: {{ .name | quote }}
          patternType: {{ .patternType }}
        operations: {{ .operations | toJson }}
      {{- end }}
      {{- if not .acls }} []{{ end }}
{{- end }}
{{- end }}
