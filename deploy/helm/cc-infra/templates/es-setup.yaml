{{- if .Values.elasticsearch.enabled }}
# Roles, users, ILM policies, index templates and write aliases: the compose script scripts/es-setup.sh, unchanged, run as a Job.
apiVersion: v1
kind: ConfigMap
metadata:
  name: es-setup
data:
  es-setup.sh: |-
    {{- .Files.Get "files/es-setup.sh" | nindent 4 }}
  {{- range $path, $content := .Files.Glob "files/es/*.json" }}
  {{ base $path }}: |-
    {{- $content | toString | nindent 4 }}
  {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: es-setup
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    ignore-check.kube-linter.io/no-liveness-probe: "run-to-completion Job"
    ignore-check.kube-linter.io/no-readiness-probe: "run-to-completion Job"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: es-setup
        app.kubernetes.io/part-of: cc-platform
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: es-setup
          image: docker.elastic.co/elasticsearch/elasticsearch:{{ .Values.elasticsearch.version }}
          command:
            - /bin/bash
            - -c
            - |
              until curl -sf --cacert /pki/ca.crt -o /dev/null -K <(printf 'user = "elastic:%s"\n' "$ELASTIC_PASSWORD") "$ES_URL/_cluster/health?wait_for_status=yellow&timeout=5s"; do echo "waiting for Elasticsearch ..."; sleep 5; done
              # the script writes its work files to /tmp and reads the JSON from /es
              mkdir -p /es && cp /config/*.json /es/ && exec /bin/bash /config/es-setup.sh
          env:
            - { name: ES_URL, value: "https://{{ .Values.elasticsearch.name }}-es-http:9200" }
            - { name: ES_CACERT, value: /pki/ca.crt }
            - { name: ES_DIR, value: /es }
            - name: ELASTIC_PASSWORD
              valueFrom: { secretKeyRef: { name: "{{ .Values.elasticsearch.name }}-es-elastic-user", key: elastic } }
            {{- range tuple "KIBANA_PASSWORD" "LOGSTASH_WRITER_PASSWORD" "QUERY_API_PASSWORD" "ANALYST_PASSWORD" "OPS_PASSWORD" "OBS_EXPORTER_PASSWORD" "GRAFANA_ES_PASSWORD" }}
            - name: {{ . }}
              valueFrom: { secretKeyRef: { name: cc-es-passwords, key: {{ . }} } }
            {{- end }}
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
            - { name: pki, mountPath: /pki, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: es, mountPath: /es }
      volumes:
        - name: config
          configMap: { name: es-setup, defaultMode: 0444 }
        - name: pki
          secret:
            secretName: {{ .Values.elasticsearch.name }}-es-http-cert
            defaultMode: 0444
            items: [{ key: ca.crt, path: ca.crt }]
        - { name: tmp, emptyDir: {} }
        - { name: es, emptyDir: {} }
{{- end }}
