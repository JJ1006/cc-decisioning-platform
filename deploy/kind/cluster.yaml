# kind cluster "cc": one node. The gateway is a NodePort (30443) published on localhost:8443 like in compose; Kibana and Grafana
# (kind-full only) come through ingress-nginx on 80/443 as https://kibana.localtest.me and https://grafana.localtest.me.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cc
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - { containerPort: 30443, hostPort: 8443, listenAddress: 127.0.0.1, protocol: TCP } # APISIX, mutual TLS
      - { containerPort: 443, hostPort: 5443, listenAddress: 127.0.0.1, protocol: TCP } # ingress-nginx https (Kibana, Grafana); kind-full
      - { containerPort: 80, hostPort: 5080, listenAddress: 127.0.0.1, protocol: TCP }
