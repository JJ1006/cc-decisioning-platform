# The only Application applied by hand (make argocd-up / the OpenShift GitOps steps in docs/runbooks/gitops.md). It renders deploy/argocd/apps/openshift
# (every other Application, in sync-wave order) and the AppProjects. Everything else follows from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: openshift-gitops
spec:
  project: root
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  sources:
    - repoURL: https://github.com/JJ1006/cc-decisioning-platform.git
      targetRevision: v1.0.1
      path: deploy/argocd/apps/openshift
    - repoURL: https://github.com/JJ1006/cc-decisioning-platform.git
      targetRevision: v1.0.1
      path: deploy/argocd/projects/openshift
  syncPolicy:
    # manual: the root of the OpenShift environment is synced by a human too
    syncOptions: [PruneLast=true]
