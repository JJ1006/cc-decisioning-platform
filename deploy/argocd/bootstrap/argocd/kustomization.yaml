# Argo CD v3.5.5, minimal: no Dex (no SSO; the local admin user is enough for kind), no notifications, no ApplicationSet controller (the Applications are plain
# files). Small requests/limits so it fits next to the platform on a 7 GB Docker VM. `kubectl apply -k deploy/argocd/bootstrap/argocd --server-side`
# (make argocd-up does it). The version is pinned in the URL; upgrade by changing it here and reading the release notes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.5/manifests/install.yaml
patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-applicationset-controller
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-dex-server
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-notifications-controller
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: argocd-applicationset-controller
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: argocd-dex-server
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: argocd-notifications-controller
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: argocd-applicationset-controller
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: argocd-dex-server
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: argocd-notifications-controller
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: argocd-applicationset-controller
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: argocd-dex-server
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: argocd-notifications-controller
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: argocd-applicationset-controller
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: argocd-applicationset-controller
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-notifications-cm
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-notifications-secret
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: argocd-applicationset-controller
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: argocd-dex-server
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: argocd-notifications-controller-metrics
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: argocd-applicationset-controller-network-policy
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: argocd-dex-server-network-policy
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: argocd-notifications-controller-network-policy
  - target: { kind: Deployment, name: argocd-server }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: "1", memory: 512Mi }
  - target: { kind: Deployment, name: argocd-repo-server }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 100m, memory: 256Mi }
          limits: { cpu: "1", memory: 768Mi }
  - target: { kind: Deployment, name: argocd-redis }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 20m, memory: 32Mi }
          limits: { cpu: "1", memory: 128Mi }
  - target: { kind: StatefulSet, name: argocd-application-controller }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 200m, memory: 256Mi }
          limits: { cpu: "1", memory: 768Mi }
