# OpenShift GitOps operator (Argo CD). Apply once as cluster admin: oc apply -f deploy/argocd/bootstrap/openshift/subscription.yaml
# Manual install plan: approve the first one (oc get installplan -n openshift-operators) after checking the version.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-gitops-operator
  namespace: openshift-operators
spec:
  channel: latest
  name: openshift-gitops-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Manual
