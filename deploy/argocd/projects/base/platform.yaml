# platform: operators and the infrastructure custom resources. The only project allowed to create cluster-scoped objects, and only these kinds.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Operators (cert-manager, Strimzi, ECK, ingress-nginx), cc-infra, Filebeat and the observability stack
  sourceRepos:
    - https://github.com/JJ1006/cc-decisioning-platform.git
    # pinned chart repositories (the charts themselves are pinned by version in each Application)
    - https://charts.jetstack.io
    - https://strimzi.io/charts/
    - https://helm.elastic.co
    - https://kubernetes.github.io/ingress-nginx
  destinations:
    - { server: https://kubernetes.default.svc, namespace: cc }
    - { server: https://kubernetes.default.svc, namespace: cert-manager }
    - { server: https://kubernetes.default.svc, namespace: strimzi-system }
    - { server: https://kubernetes.default.svc, namespace: elastic-system }
    - { server: https://kubernetes.default.svc, namespace: ingress-nginx }
    - { server: https://kubernetes.default.svc, namespace: kube-system } # cert-manager leader election Role
  clusterResourceWhitelist: # what the operators and cc-infra need at cluster scope, nothing else
    - { group: "", kind: Namespace }
    - { group: apiextensions.k8s.io, kind: CustomResourceDefinition }
    - { group: rbac.authorization.k8s.io, kind: ClusterRole }
    - { group: rbac.authorization.k8s.io, kind: ClusterRoleBinding }
    - { group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration }
    - { group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration }
    - { group: networking.k8s.io, kind: IngressClass }
    - { group: cert-manager.io, kind: ClusterIssuer }
  orphanedResources: { warn: true }
