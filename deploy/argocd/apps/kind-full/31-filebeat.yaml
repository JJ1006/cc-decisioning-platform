# Filebeat DaemonSet (ClusterRole + hostPath, so project platform).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: filebeat
  namespace: argocd
  labels:
    cc/revision: follow # the root application can point every labelled application at another branch (make argocd-up REVISION=...)
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: cc
  sources:
    - repoURL: https://github.com/JJ1006/cc-decisioning-platform.git
      targetRevision: main
      path: deploy/helm/charts/filebeat
      helm:
        releaseName: filebeat
        valueFiles:
          - $values/deploy/argocd/apps/kind-full/values/filebeat.yaml
    - repoURL: https://github.com/JJ1006/cc-decisioning-platform.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated: { prune: true, selfHeal: true } # kind: Git is the truth, drift is reverted
    syncOptions: [ServerSideApply=true, PruneLast=true]
    retry: { limit: 5, backoff: { duration: 15s, factor: 2, maxDuration: 3m } }
