# Strimzi operator (pinned chart), watches the namespace cc only.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: strimzi-system
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: 1.3.0
    helm:
      releaseName: strimzi
      valuesObject:
        watchNamespaces: [cc]
        resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 384Mi } }
  syncPolicy:
    automated: { prune: true, selfHeal: true } # kind: Git is the truth, drift is reverted
    syncOptions: [ServerSideApply=true, PruneLast=true, CreateNamespace=true]
    retry: { limit: 5, backoff: { duration: 15s, factor: 2, maxDuration: 3m } }
