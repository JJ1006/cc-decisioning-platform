# kube-prometheus-stack, Tempo and the OTel collector (upstream charts built by the repo server).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cc-observability
  namespace: argocd
  labels:
    cc/revision: follow # the root application can point every labelled application at another branch (make argocd-up REVISION=...)
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: cc
  sources:
    - repoURL: https://github.com/JJ1006/cc-decisioning-platform.git
      targetRevision: main
      path: deploy/helm/charts/cc-observability
      helm:
        releaseName: obs
        valueFiles:
          - values-kind-full.yaml
          - $values/deploy/argocd/apps/kind-full/values/cc-observability.yaml
    - repoURL: https://github.com/JJ1006/cc-decisioning-platform.git
      targetRevision: main
      ref: values
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: [".webhooks[]?.clientConfig.caBundle"]
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions: [".webhooks[]?.clientConfig.caBundle"]
  syncPolicy:
    automated: { prune: true, selfHeal: true } # kind: Git is the truth, drift is reverted
    syncOptions: [ServerSideApply=true, PruneLast=true]
    retry: { limit: 5, backoff: { duration: 15s, factor: 2, maxDuration: 3m } }
