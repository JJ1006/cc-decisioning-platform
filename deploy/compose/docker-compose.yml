# Local stack. Run via `make up PROFILE=core,analytics` (needs `make pki` first).
#   core       kafka (mTLS), topic-init, elasticsearch (TLS), es-setup, odm, the event services, logstash, filebeat
#   analytics  kibana, kafka-ui, decision-query-api   (requires core)
#   obs        otel-collector, tempo, prometheus, alertmanager, grafana (:3000, https) and the exporters (kafka, elasticsearch, logstash,
#              blackbox): metrics, traces and infrastructure alerts. About 1 GB; with core+edge it fits in 7 GB, add analytics only on a
#              larger Docker VM (docs/observability.md).
#   mcp        odm-dc-mcp (our MCP server, /mcp/dc at the gateway) and odm-res-mcp (the official ODM one): AI agents, docs/mcp.md
#   edge       apisix gateway (:8443, mutual TLS) and application-api   (requires core; status, decisions and statistics also need
#              decision-query-api from analytics). Service ports are not published: see compose.debug.yml.
# All images are multi-arch; ODM and the rest run natively on Apple Silicon.
# Dev only: passwords come from ../../.env (see .env.example); keys live in security/pki/out.
name: ${COMPOSE_PROJECT_NAME:-ccplatform}

services:
  # ---------------------------------------------------------------- core
  kafka:
    image: apache/kafka:3.9.2@sha256:05b4616e0702ef2729327705d54ad6b50ea70b271c4b730fabd2320789fb7b02
    profiles: [core]
    env_file: [.env.derived] # generated from the root env file by scripts/compose.sh
    mem_limit: 768m
    hostname: kafka
    ports:
      - "127.0.0.1:9093:9094" # host listener (mTLS); containers use kafka:9093
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9095
      KAFKA_LISTENERS: INTERNAL://:9093,EXTERNAL://:9094,CONTROLLER://:9095
      # listener names must not end in "SSL": the image's SSL helper would then demand file-based secrets
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SSL,EXTERNAL:SSL,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER # internal, not published
      KAFKA_SSL_CLIENT_AUTH: required
      # ACLs (docs/security-mtls.md, generated into kafka-acls.args): the principal is the CN of the client certificate. Default deny.
      # kafka: the broker's own certificate (inter-broker listener); admin: topic-init, acl-init and the CLI; ANONYMOUS: the plaintext KRaft
      # controller listener, which is not published and has no client certificate to map.
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: "RULE:^.*CN=([^,]+).*$$/$$1/,DEFAULT"
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: "User:admin;User:kafka;User:ANONYMOUS"
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_LOCATION: /pki/kafka.p12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_LOCATION: /pki/truststore.p12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ${PKI_DIR:-../../security/pki/out}/kafka/kafka.p12:/pki/kafka.p12:ro
      - ${PKI_DIR:-../../security/pki/out}/truststore.p12:/pki/truststore.p12:ro
      - ${PKI_DIR:-../../security/pki/out}/admin/admin.p12:/pki/admin/admin.p12:ro
      - ${PKI_DIR:-../../security/pki/out}/kafka-client.properties:/pki/kafka-client.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9093 --command-config /pki/kafka-client.properties >/dev/null 2>&1"]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 30s

  topic-init:
    image: apache/kafka:3.9.2@sha256:05b4616e0702ef2729327705d54ad6b50ea70b271c4b730fabd2320789fb7b02
    profiles: [core]
    mem_limit: 256m
    restart: "no"
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      KAFKA_HEAP_OPTS: -Xmx128m
      BOOTSTRAP: kafka:9093
      COMMAND_CONFIG: /pki/kafka-client.properties
      TOPICS_DOC: /docs/kafka-topics.md
    volumes:
      - ../../scripts/create-topics.sh:/scripts/create-topics.sh:ro
      - ../../docs/kafka-topics.md:/docs/kafka-topics.md:ro
      - ${PKI_DIR:-../../security/pki/out}/truststore.p12:/pki/truststore.p12:ro
      - ${PKI_DIR:-../../security/pki/out}/admin/admin.p12:/pki/admin/admin.p12:ro
      - ${PKI_DIR:-../../security/pki/out}/kafka-client.properties:/pki/kafka-client.properties:ro

  # applies the generated ACLs (default deny: only the super users may do anything until this has run); idempotent
  acl-init:
    image: apache/kafka:3.9.2@sha256:05b4616e0702ef2729327705d54ad6b50ea70b271c4b730fabd2320789fb7b02
    profiles: [core]
    mem_limit: 256m
    restart: "no"
    depends_on:
      topic-init: { condition: service_completed_successfully }
    entrypoint: ["/bin/bash", "/scripts/apply-kafka-acls.sh"]
    environment:
      KAFKA_HEAP_OPTS: -Xmx128m
      BOOTSTRAP: kafka:9093
      COMMAND_CONFIG: /pki/kafka-client.properties
      ACLS_FILE: /acls/kafka-acls.args
    volumes:
      - ../../scripts/apply-kafka-acls.sh:/scripts/apply-kafka-acls.sh:ro
      - ./kafka-acls.args:/acls/kafka-acls.args:ro
      - ${PKI_DIR:-../../security/pki/out}/truststore.p12:/pki/truststore.p12:ro
      - ${PKI_DIR:-../../security/pki/out}/admin/admin.p12:/pki/admin/admin.p12:ro
      - ${PKI_DIR:-../../security/pki/out}/kafka-client.properties:/pki/kafka-client.properties:ro

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23@sha256:4d0724bb8d78d7a2330693623e26ca4d621079d062ecc8a30b3e1fc180ec14c1
    profiles: [core]
    env_file: [.env.derived] # generated from the root env file by scripts/compose.sh
    mem_limit: 1280m # 1.25 GB: heap 640 MB plus off-heap
    hostname: elasticsearch
    ports:
      - "127.0.0.1:9200:9200"
    # ES only reads SSL files from inside its config dir
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms640m -Xmx640m
      xpack.security.enabled: "true"
      xpack.ml.enabled: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      xpack.security.http.ssl.enabled: "true"
      xpack.security.http.ssl.key: /usr/share/elasticsearch/config/certs/elasticsearch.key
      xpack.security.http.ssl.certificate: /usr/share/elasticsearch/config/certs/elasticsearch.crt
      xpack.security.http.ssl.certificate_authorities: /usr/share/elasticsearch/config/certs/ca.crt
      xpack.security.http.ssl.client_authentication: optional # services may present client certs
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.key: /usr/share/elasticsearch/config/certs/elasticsearch.key
      xpack.security.transport.ssl.certificate: /usr/share/elasticsearch/config/certs/elasticsearch.crt
      xpack.security.transport.ssl.certificate_authorities: /usr/share/elasticsearch/config/certs/ca.crt
      xpack.security.transport.ssl.verification_mode: certificate
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - ${PKI_DIR:-../../security/pki/out}/elasticsearch/elasticsearch.key:/usr/share/elasticsearch/config/certs/elasticsearch.key:ro
      - ${PKI_DIR:-../../security/pki/out}/elasticsearch/elasticsearch.crt:/usr/share/elasticsearch/config/certs/elasticsearch.crt:ro
      - ${PKI_DIR:-../../security/pki/out}/ca/ca.crt:/usr/share/elasticsearch/config/certs/ca.crt:ro
    ulimits:
      memlock: { soft: -1, hard: -1 }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --cacert /usr/share/elasticsearch/config/certs/ca.crt -u elastic:$$ELASTIC_PASSWORD 'https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  es-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.23@sha256:4d0724bb8d78d7a2330693623e26ca4d621079d062ecc8a30b3e1fc180ec14c1
    profiles: [core]
    env_file: [.env.derived] # generated from the root env file by scripts/compose.sh
    mem_limit: 128m
    restart: "no"
    depends_on:
      elasticsearch: { condition: service_healthy }
    # kibana_system password, least-privilege logstash_writer user, index templates, write aliases
    entrypoint: ["/bin/bash", "/scripts/es-setup.sh"]
    volumes:
      - ../../scripts/es-setup.sh:/scripts/es-setup.sh:ro
      - ../es:/es:ro
      - ${PKI_DIR:-../../security/pki/out}/ca/ca.crt:/pki/ca.crt:ro

  odm:
    # ODM for Developers 9.5.x all-in-one (Decision Center + RES + Decision Runner). NOT open
    # source, dev/eval only: you accept the IBM licence by running it. Pulled, never redistributed.
    image: icr.io/cpopen/odm-k8s/odm:9.5.0.1-IF019_25.1.0@sha256:90e19335932a386e057beb16759c4e5985c55eb7bd06e57dd86ec3fc7d81773d
    profiles: [core]
    env_file: [.env.derived] # generated from the root env file by scripts/compose.sh
    mem_limit: ${ODM_MEM:-2560m}
    hostname: odm
    ports:
      - "127.0.0.1:9443:9453" # https (Liberty listens on 9453 in this image; host keeps 9443)
    environment:
      LICENSE: accept
      # The image runs Semeru (OpenJ9), whose default max heap is 75% of the container limit: 1.9 GB of 2.5 GB left too little for the native
      # memory of Liberty (class memory, JIT, thread stacks, direct buffers) and the kernel OOM-killed ODM (exit 137) under load.
      # About 65% of ODM_MEM for the heap. OpenJ9 keeps classes in native memory (no -XX:MaxMetaspaceSize); -Xss bounds the thread stacks.
      JVM_ARGS: ${ODM_JVM_ARGS:--Xms512m -Xmx1664m -Xss512k}
      SAMPLE: ${ODM_SAMPLE:-false} # true loads the Loan Validation sample (format template for scripts/gen_dc_project.py)
      # Liberty HTTPS uses our CA-signed cert and REQUIRES a client certificate signed by our CA (deploy/odm/mtls.xml).
      # The plain http port 9060 is not published: Decision Center reaches RES on it inside the container.
    volumes:
      - ../odm/mtls.xml:/config/configDropins/overrides/mtls.xml:ro
      - ../odm/metrics.xml:/config/configDropins/overrides/metrics.xml:ro
      - ${PKI_DIR:-../../security/pki/out}/odm/odm.jks:/config/security/volume/keystore.jks:ro
      - ${PKI_DIR:-../../security/pki/out}/truststore.jks:/config/security/volume/truststore.jks:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -f http://localhost:9060/res/"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s

  txn-generator:
    build: { context: ../.., dockerfile: services/txn-generator/Dockerfile }
    image: ccplatform/txn-generator:dev
    labels:
      co.elastic.logs/enabled: "true" # Filebeat ships this container's logs
    logging: # Docker Desktop defaults to the "local" driver, which Filebeat cannot read
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    profiles: [core]
    env_file: [.env.derived]
    mem_limit: 320m # includes the OpenTelemetry agent
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
      acl-init: { condition: service_completed_successfully }
    environment:
      OTEL_SERVICE_NAME: txn-generator
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.namespace=cc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_SAMPLER: parentbased_always_on # production: parentbased_traceidratio with OTEL_TRACES_SAMPLER_ARG=0.1
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false} # make up sets it to true when the obs profile is not selected
      SERVER_SSL_ENABLED: "true" # mutual TLS on the service port; only the listed client CNs may call (apisix)
      SERVER_KEYSTORE: /pki/keystore.p12
      SERVER_TRUSTSTORE: /pki/truststore.p12
      MANAGEMENT_PORT: "9090" # plain http for probes and metrics, never published
      KAFKA_BOOTSTRAP: kafka:9093
      KAFKA_KEYSTORE: /pki/keystore.p12
      KAFKA_TRUSTSTORE: /pki/truststore.p12
    volumes:
      - ${PKI_DIR:-../../security/pki/out}/txn-generator/txn-generator.p12:/pki/keystore.p12:ro
      - ${PKI_DIR:-../../security/pki/out}/truststore.p12:/pki/truststore.p12:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/actuator/health/readiness >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  decision-orchestrator:
    build: { context: ../.., dockerfile: services/decision-orchestrator/Dockerfile }
    image: ccplatform/decision-orchestrator:dev
    labels:
      co.elastic.logs/enabled: "true" # Filebeat ships this container's logs
    logging: # Docker Desktop defaults to the "local" driver, which Filebeat cannot read
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    profiles: [core]
    env_file: [.env.derived]
    mem_limit: 384m # includes the OpenTelemetry agent
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
      acl-init: { condition: service_completed_successfully }
      odm: { condition: service_healthy }
    environment:
      OTEL_SERVICE_NAME: decision-orchestrator
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.namespace=cc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_SAMPLER: parentbased_always_on # production: parentbased_traceidratio with OTEL_TRACES_SAMPLER_ARG=0.1
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false} # make up sets it to true when the obs profile is not selected
      KAFKA_BOOTSTRAP: kafka:9093
      KAFKA_KEYSTORE: /pki/keystore.p12
      KAFKA_TRUSTSTORE: /pki/truststore.p12
      RES_BASE_URL: https://odm:9453
      RES_TRUSTSTORE: /pki/truststore.p12
      RES_KEYSTORE: /pki/keystore.p12 # client certificate for ODM (mutual TLS)
    volumes:
      - ${PKI_DIR:-../../security/pki/out}/decision-orchestrator/decision-orchestrator.p12:/pki/keystore.p12:ro
      - ${PKI_DIR:-../../security/pki/out}/truststore.p12:/pki/truststore.p12:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  notification-svc:
    build: { context: ../.., dockerfile: services/notification-svc/Dockerfile }
    image: ccplatform/notification-svc:dev
    labels:
      co.elastic.logs/enabled: "true" # Filebeat ships this container's logs
    logging: # Docker Desktop defaults to the "local" driver, which Filebeat cannot read
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    profiles: [core]
    env_file: [.env.derived]
    mem_limit: 320m # includes the OpenTelemetry agent
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
      acl-init: { condition: service_completed_successfully }
    environment:
      OTEL_SERVICE_NAME: notification-svc
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.namespace=cc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_SAMPLER: parentbased_always_on # production: parentbased_traceidratio with OTEL_TRACES_SAMPLER_ARG=0.1
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false} # make up sets it to true when the obs profile is not selected
      KAFKA_BOOTSTRAP: kafka:9093
      KAFKA_KEYSTORE: /pki/keystore.p12
      KAFKA_TRUSTSTORE: /pki/truststore.p12
    volumes:
      - ${PKI_DIR:-../../security/pki/out}/notification-svc/notification-svc.p12:/pki/keystore.p12:ro
      - ${PKI_DIR:-../../security/pki/out}/truststore.p12:/pki/truststore.p12:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  logstash:
    # Kafka -> Elasticsearch ingestion with PII masking (replaces the custom es-indexer, ADR-0009), DLQ topics,
    # Filebeat logs. Pinned to the Elasticsearch version. Elastic licence (free basic tier).
    image: docker.elastic.co/logstash/logstash:8.19.23@sha256:a77c29e406ddc6311b302703889f0953b5620dd5aa2445b0cdbcf7f88e285766
    profiles: [core]
    env_file: [.env.derived]
    mem_limit: 896m # was 768m: the heap is 384 MB, the rest is off-heap (Netty, queues); it ran at 99% of 768m
    hostname: logstash
    restart: unless-stopped
    ports:
      - "127.0.0.1:9600:9600" # monitoring API (Prometheus scrapes it in P8)
    depends_on:
      kafka: { condition: service_healthy }
      acl-init: { condition: service_completed_successfully }
      es-setup: { condition: service_completed_successfully }
    environment:
      LS_JAVA_OPTS: -Xms384m -Xmx384m
    volumes:
      - ../logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ../logstash/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ../logstash/pipelines:/usr/share/logstash/pipeline:ro
      - ../logstash/ruby:/usr/share/logstash/ruby:ro
      - logstash-data:/usr/share/logstash/data # persistent queues and the dead letter queue
      - ${PKI_DIR:-../../security/pki/out}/logstash/logstash.p12:/pki/keystore.p12:ro
      - ${PKI_DIR:-../../security/pki/out}/truststore.p12:/pki/truststore.p12:ro
      - ${PKI_DIR:-../../security/pki/out}/ca/ca.crt:/pki/ca.crt:ro
      - ${PKI_DIR:-../../security/pki/out}/logstash/logstash.crt:/pki/logstash.crt:ro
      - ${PKI_DIR:-../../security/pki/out}/logstash/logstash.pk8.key:/pki/logstash.pk8.key:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9600/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.19.23@sha256:2122adc42e6aa4b2fcb81d1c38725dbe27957d1b9d5cc058a18375c2eab62d52
    profiles: [core]
    mem_limit: 128m
    restart: unless-stopped
    # root: needs the Docker socket and the container log files (the one image here that is not non-root)
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    depends_on:
      logstash: { condition: service_healthy }
    volumes:
      - ../filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${PKI_DIR:-../../security/pki/out}/ca/ca.crt:/pki/ca.crt:ro
      - ${PKI_DIR:-../../security/pki/out}/filebeat/filebeat.crt:/pki/filebeat.crt:ro
      - ${PKI_DIR:-../../security/pki/out}/filebeat/filebeat.key:/pki/filebeat.key:ro

  # ----------------------------------------------------------- analytics
  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.23@sha256:920b24f689833d34205f426f5359864378a572e829c53016073f0a6837c2e995
    profiles: [analytics]
    env_file: [.env.derived] # generated from the root env file by scripts/compose.sh
    mem_limit: 900m
    hostname: kibana
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch: { condition: service_healthy }
      es-setup: { condition: service_completed_successfully }
    environment:
      NODE_OPTIONS: --max-old-space-size=512
      ELASTICSEARCH_HOSTS: https://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES: /pki/ca.crt
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CERTIFICATE: /pki/kibana.crt
      SERVER_SSL_KEY: /pki/kibana.key
      SERVER_PUBLICBASEURL: https://localhost:5601
      TELEMETRY_OPTIN: "false"
      TELEMETRY_ALLOWCHANGINGOPTINSTATUS: "false" # no "help us improve" banner
    volumes:
      - ${PKI_DIR:-../../security/pki/out}/kibana/kibana.crt:/pki/kibana.crt:ro
      - ${PKI_DIR:-../../security/pki/out}/kibana/kibana.key:/pki/kibana.key:ro
      - ${PKI_DIR:-../../security/pki/out}/ca/ca.crt:/pki/ca.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --cacert /pki/ca.crt https://localhost:5601/api/status >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    profiles: [analytics]
    env_file: [.env.derived] # generated from the root env file by scripts/compose.sh
    mem_limit: 512m
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      kafka: { condition: service_healthy }
      acl-init: { condition: service_completed_successfully }
    environment:
      JAVA_OPTS: -Xms128m -Xmx320m
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SSL
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_LOCATION: /pki/kafka-ui.p12
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION: /pki/truststore.p12
      DYNAMIC_CONFIG_ENABLED: "false"
    volumes:
      - ${PKI_DIR:-../../security/pki/out}/kafka-ui/kafka-ui.p12:/pki/kafka-ui.p12:ro
      - ${PKI_DIR:-../../security/pki/out}/truststore.p12:/pki/truststore.p12:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  decision-query-api:
    build: { context: ../.., dockerfile: services/decision-query-api/Dockerfile }
    image: ccplatform/decision-query-api:dev
    labels:
      co.elastic.logs/enabled: "true" # Filebeat ships this container's logs
    logging: # Docker Desktop defaults to the "local" driver, which Filebeat cannot read
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    profiles: [analytics]
    env_file: [.env.derived] # QUERY_API_PASSWORD: the read-only Elasticsearch user decision-query-api
    mem_limit: 384m # includes the OpenTelemetry agent
    restart: unless-stopped
    depends_on:
      elasticsearch: { condition: service_healthy }
      es-setup: { condition: service_completed_successfully }
    environment:
      OTEL_SERVICE_NAME: decision-query-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.namespace=cc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_SAMPLER: parentbased_always_on # production: parentbased_traceidratio with OTEL_TRACES_SAMPLER_ARG=0.1
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false} # make up sets it to true when the obs profile is not selected
      SERVER_SSL_ENABLED: "true" # mutual TLS on the service port; only the listed client CNs may call (apisix, application-api)
      SERVER_KEYSTORE: /pki/keystore.p12
      SERVER_TRUSTSTORE: /pki/truststore.p12
      MANAGEMENT_PORT: "9090" # plain http for probes and metrics, never published
      ES_URL: https://elasticsearch:9200
      ES_CA: /pki/ca.crt
    volumes:
      - ${PKI_DIR:-../../security/pki/out}/decision-query-api/decision-query-api.p12:/pki/keystore.p12:ro
      - ${PKI_DIR:-../../security/pki/out}/truststore.p12:/pki/truststore.p12:ro
      - ${PKI_DIR:-../../security/pki/out}/ca/ca.crt:/pki/ca.crt:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/actuator/health/readiness >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ----------------------------------------------------------- edge
  application-api:
    build: { context: ../.., dockerfile: services/application-api/Dockerfile }
    image: ccplatform/application-api:dev
    labels:
      co.elastic.logs/enabled: "true" # Filebeat ships this container's logs
    logging: # Docker Desktop defaults to the "local" driver, which Filebeat cannot read
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    profiles: [edge]
    env_file: [.env.derived]
    mem_limit: 384m # includes the OpenTelemetry agent
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
      acl-init: { condition: service_completed_successfully }
      decision-query-api: { condition: service_healthy, required: false } # analytics profile
    environment:
      OTEL_SERVICE_NAME: application-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=local,service.namespace=cc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_TRACES_SAMPLER: parentbased_always_on # production: parentbased_traceidratio with OTEL_TRACES_SAMPLER_ARG=0.1
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false} # make up sets it to true when the obs profile is not selected
      SERVER_SSL_ENABLED: "true" # mutual TLS on the service port; only the listed client CNs may call (apisix)
      SERVER_KEYSTORE: /pki/keystore.p12
      SERVER_TRUSTSTORE: /pki/truststore.p12
      MANAGEMENT_PORT: "9090" # plain http for probes and metrics, never published
      KAFKA_BOOTSTRAP: kafka:9093
      KAFKA_KEYSTORE: /pki/keystore.p12
      KAFKA_TRUSTSTORE: /pki/truststore.p12
      QUERY_API_URL: https://decision-query-api:8080
    volumes:
      - ${PKI_DIR:-../../security/pki/out}/application-api/application-api.p12:/pki/keystore.p12:ro
      - ${PKI_DIR:-../../security/pki/out}/truststore.p12:/pki/truststore.p12:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/actuator/health/readiness >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ----------------------------------------------------------- edge: the gateway
  apisix:
    # Apache APISIX 3.x, standalone (declarative gateway/apisix/apisix.yaml.tmpl, no etcd). The only published port of the
    # APIs: 8443, mutual TLS, client certificate required. Replaces Apigee (docs/apigee-mapping.md).
    image: apache/apisix:3.13.0-debian@sha256:c5c7a55ebb5c07abc210dbb963a37f41030e12c91d23bacedbaa168fec633bd7
    profiles: [edge]
    labels:
      co.elastic.logs/enabled: "true" # Filebeat ships this container's logs
    logging: # Docker Desktop defaults to the "local" driver, which Filebeat cannot read
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    mem_limit: 256m
    restart: unless-stopped
    hostname: apisix
    environment:
      APISIX_OTEL_SAMPLER: ${APISIX_OTEL_SAMPLER:-always_off} # always_on with the obs profile (make up sets it)
      # limits of the gateway: the defaults are the real ones; `make load-test` raises them for the run only (evals/k6) and restores them
      GATEWAY_QUOTA_PER_MINUTE: ${GATEWAY_QUOTA_PER_MINUTE:-100}
      GATEWAY_SUBMIT_RATE: ${GATEWAY_SUBMIT_RATE:-5}
      GATEWAY_SUBMIT_BURST: ${GATEWAY_SUBMIT_BURST:-5}
    entrypoint: ["/bin/sh", "/gateway/entrypoint.sh"]
    ports:
      - "127.0.0.1:8443:9443"
    depends_on:
      application-api: { condition: service_healthy }
      decision-query-api: { condition: service_healthy, required: false } # analytics profile
      txn-generator: { condition: service_healthy }
      odm-dc-mcp: { condition: service_healthy, required: false } # mcp profile
    volumes:
      - ../../gateway/apisix/entrypoint.sh:/gateway/entrypoint.sh:ro
      - ../../gateway/apisix/apisix.yaml.tmpl:/gateway/apisix.yaml.tmpl:ro
      - ../../gateway/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ${PKI_DIR:-../../security/pki/out}/apisix/apisix.crt:/pki/apisix.crt:ro
      - ${PKI_DIR:-../../security/pki/out}/apisix/apisix.key:/pki/apisix.key:ro
      - ${PKI_DIR:-../../security/pki/out}/ca/ca.crt:/pki/ca.crt:ro
    healthcheck: # the image has no curl: a raw HTTP request to the Prometheus exporter (9091, inside the container)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9091 && printf 'GET /apisix/prometheus/metrics HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ----------------------------------------------------------- obs: metrics, traces, alerts, dashboards (logs stay in ELK)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0@sha256:e39311df1f3d941923c00da79ac7ba6269124a870ee87e3c3ad24d60f8aee4d2
    profiles: [obs]
    mem_limit: 128m
    restart: unless-stopped
    command: ["--config=/etc/otelcol/collector.yaml"]
    depends_on:
      tempo: { condition: service_started }
    volumes:
      - ../../observability/otel/collector.yaml:/etc/otelcol/collector.yaml:ro

  tempo:
    image: grafana/tempo:2.10.8@sha256:f0561deb1c68ec44d6e6e7e4487f30106c4e5e768642077695b37958b105812a
    profiles: [obs]
    mem_limit: 320m # 256m was too tight (it ran at 99%)
    restart: unless-stopped
    user: "0:0" # local demo: the named volume is root-owned
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../../observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [obs]
    mem_limit: 256m
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090" # plain http, no login: a developer tool, loopback only
    depends_on:
      alertmanager: { condition: service_started }
    volumes:
      - ../../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/prometheus/rules:/etc/prometheus/rules:ro
      - ${PKI_DIR:-../../security/pki/out}/ca/ca.crt:/pki/ca.crt:ro
      - ${PKI_DIR:-../../security/pki/out}/admin/admin.crt:/pki/odm-client.crt:ro
      - ${PKI_DIR:-../../security/pki/out}/admin/admin.key:/pki/odm-client.key:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    profiles: [obs]
    mem_limit: 64m
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    ports:
      - "127.0.0.1:9097:9093" # 9093 on the host is Kafka
    volumes:
      - ../../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana-oss:11.6.5@sha256:d552f949693c54d17c6f867ff6aeb128b021e54e923895dcf9cd6aa8176c0d74
    profiles: [obs]
    mem_limit: 192m
    restart: unless-stopped
    hostname: grafana
    ports:
      - "127.0.0.1:3000:3000" # https with our certificate; log in as admin (GRAFANA_ADMIN_PASSWORD in the root env file)
    depends_on:
      prometheus: { condition: service_started }
      tempo: { condition: service_started }
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make up once to generate it}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /pki/grafana.crt
      GF_SERVER_CERT_KEY: /pki/grafana.key
      GF_SERVER_ROOT_URL: https://localhost:3000
      GF_UNIFIED_ALERTING_ENABLED: "false" # alerts are Prometheus rules in Alertmanager (and the business ones in Kibana)
      GF_ALERTING_ENABLED: "false"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
      GRAFANA_ES_PASSWORD: ${GRAFANA_ES_PASSWORD:?run make up once to generate it}
    volumes:
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${PKI_DIR:-../../security/pki/out}/grafana/grafana.crt:/pki/grafana.crt:ro
      - ${PKI_DIR:-../../security/pki/out}/grafana/grafana.key:/pki/grafana.key:ro
      - ${PKI_DIR:-../../security/pki/out}/ca/ca.crt:/pki/ca.crt:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O- https://localhost:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0@sha256:346a53c2489a3530790d01f7b96632496d0d58926662f4c35bb65f569db2ab42
    profiles: [obs]
    mem_limit: 64m
    restart: unless-stopped
    command:
      - --kafka.server=kafka:9093
      - --tls.enabled
      - --tls.ca-file=/pki/ca.crt
      - --tls.cert-file=/pki/kafka-exporter.crt
      - --tls.key-file=/pki/kafka-exporter.key
    depends_on:
      kafka: { condition: service_healthy }
    volumes:
      - ${PKI_DIR:-../../security/pki/out}/ca/ca.crt:/pki/ca.crt:ro
      - ${PKI_DIR:-../../security/pki/out}/kafka-exporter/kafka-exporter.crt:/pki/kafka-exporter.crt:ro
      - ${PKI_DIR:-../../security/pki/out}/kafka-exporter/kafka-exporter.key:/pki/kafka-exporter.key:ro

  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.8.0@sha256:073dd360de2c9d2a13b00e22793b2d2b06f5245e029bdce76d8f80da731a2faa
    profiles: [obs]
    mem_limit: 64m
    restart: unless-stopped
    command:
      - --es.uri=https://elasticsearch:9200
      - --es.ca=/pki/ca.crt
      - --es.all
      - --es.indices
    environment:
      ES_USERNAME: metrics_exporter # monitor privileges only
      ES_PASSWORD: ${OBS_EXPORTER_PASSWORD:?run make up once to generate it}
    depends_on:
      elasticsearch: { condition: service_healthy }
      es-setup: { condition: service_completed_successfully }
    volumes:
      - ${PKI_DIR:-../../security/pki/out}/ca/ca.crt:/pki/ca.crt:ro

  logstash-exporter:
    # amd64 only image: runs under Rosetta emulation on Apple Silicon (docs/observability.md)
    image: ghcr.io/kuskoman/logstash-exporter:v1.9.2@sha256:48927299068c78dac075bb21465506eb29c87937c1addcf3ca2f53e66e1056bb
    platform: linux/amd64
    profiles: [obs]
    mem_limit: 64m
    restart: unless-stopped
    environment:
      LOGSTASH_URL: http://logstash:9600
    depends_on:
      logstash: { condition: service_healthy }

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.0@sha256:9613f2884689b6fad9f1939f6a3b0388c93a022cfaededb19545b329b5c83dea
    profiles: [obs]
    mem_limit: 32m
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ../../observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      - ${PKI_DIR:-../../security/pki/out}/ca/ca.crt:/pki/ca.crt:ro
      - ${PKI_DIR:-../../security/pki/out}/admin/admin.crt:/pki/probe.crt:ro
      - ${PKI_DIR:-../../security/pki/out}/admin/admin.key:/pki/probe.key:ro

  # ----------------------------------------------------------- mcp: the two MCP servers (docs/mcp.md)
  odm-dc-mcp:
    # Our server (mcp/odm-dc-mcp-server): Decision Center read-only, decisions and statistics through the gateway, what-if, audit on cc.audit.v1.
    # Streamable HTTP with mutual TLS; reached at https://localhost:8443/mcp/dc (gateway role MCP_CLIENT), not published.
    build: { context: ../.., dockerfile: mcp/odm-dc-mcp-server/Dockerfile }
    image: ccplatform/odm-dc-mcp:dev
    labels:
      co.elastic.logs/enabled: "true" # Filebeat ships this container's logs
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    profiles: [mcp]
    env_file: [.env.derived]
    mem_limit: 256m # was 192m: Presidio and spaCy's tokenizer idle at about 180 MB
    restart: unless-stopped
    hostname: odm-dc-mcp
    depends_on:
      kafka: { condition: service_healthy }
      acl-init: { condition: service_completed_successfully }
      odm: { condition: service_healthy }
    environment:
      TLS_CERT: /pki/server.crt
      TLS_KEY: /pki/server.key
      TLS_CA: /pki/ca.crt
      CA_FILE: /pki/ca.crt
      ALLOWED_CLIENT_CNS: apisix,odm-dc-mcp # the gateway, and the container's own health check
      DC_URL: https://odm:9453/decisioncenter-api
      RES_URL: https://odm:9453
      GATEWAY_URL: https://apisix:9443
      KAFKA_BOOTSTRAP: kafka:9093
      MCP_RES_CERT: /pki/mcp-res.crt
      MCP_RES_CERT_KEY: /pki/mcp-res.key
      MCP_AGENT_CERT: /pki/mcp-agent.crt
      MCP_AGENT_CERT_KEY: /pki/mcp-agent.key
      ALLOW_DEPLOY: "false" # deployment tool stays off; see docs/mcp.md to enable it with an approval token
    volumes:
      - ${PKI_DIR:-../../security/pki/out}/odm-dc-mcp/odm-dc-mcp.crt:/pki/server.crt:ro
      - ${PKI_DIR:-../../security/pki/out}/odm-dc-mcp/odm-dc-mcp.key:/pki/server.key:ro
      - ${PKI_DIR:-../../security/pki/out}/ca/ca.crt:/pki/ca.crt:ro
      - ${PKI_DIR:-../../security/pki/out}/mcp-res/mcp-res.crt:/pki/mcp-res.crt:ro
      - ${PKI_DIR:-../../security/pki/out}/mcp-res/mcp-res.key:/pki/mcp-res.key:ro
      - ${PKI_DIR:-../../security/pki/out}/mcp-agent/mcp-agent.crt:/pki/mcp-agent.crt:ro
      - ${PKI_DIR:-../../security/pki/out}/mcp-agent/mcp-agent.key:/pki/mcp-agent.key:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,http.client as h; c=ssl.create_default_context(cafile='/pki/ca.crt'); c.load_cert_chain('/pki/server.crt','/pki/server.key'); x=h.HTTPSConnection('odm-dc-mcp',3001,context=c,timeout=4); x.request('GET','/health'); raise SystemExit(0 if x.getresponse().status==200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 30s

  odm-res-mcp:
    # The official IBM ODM Decision MCP server at a pinned commit (mcp/odm-res-mcp): every ruleset with agent.enabled=true becomes a tool, RES over mutual TLS.
    # Remote mode speaks plain HTTP inside the compose network and is not published and not routed by the gateway (docs/mcp.md).
    build: { context: ../.., dockerfile: mcp/odm-res-mcp/Dockerfile }
    image: ccplatform/odm-res-mcp:dev
    labels:
      co.elastic.logs/enabled: "true"
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    profiles: [mcp]
    env_file: [.env.derived]
    mem_limit: 192m
    restart: unless-stopped
    hostname: odm-res-mcp
    depends_on:
      odm: { condition: service_healthy }
    environment:
      ODM_URL: https://odm:9453/res
      ODM_RUNTIME_URL: https://odm:9453/DecisionService
      SSL_CERT_PATH: /pki/ca.crt
      VERIFY_SSL_HOSTNAME: "True"
      MTLS_CERT_PATH: /pki/mcp-res.crt
      MTLS_KEY_PATH: /pki/mcp-res.key
      LOG_LEVEL: WARNING
    volumes:
      - ${PKI_DIR:-../../security/pki/out}/ca/ca.crt:/pki/ca.crt:ro
      - ${PKI_DIR:-../../security/pki/out}/mcp-res/mcp-res.crt:/pki/mcp-res.crt:ro
      - ${PKI_DIR:-../../security/pki/out}/mcp-res/mcp-res.key:/pki/mcp-res.key:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',3000),3).close()"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  kafka-data:
  es-data:
  logstash-data:
  tempo-data:
  prometheus-data:
  grafana-data:
