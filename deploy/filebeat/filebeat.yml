# Container logs of our services only: opt in with the label co.elastic.logs/enabled=true in docker-compose.yml.
filebeat.autodiscover:
  providers:
    - type: docker
      hints.enabled: true
      hints.default_config.enabled: false

processors:
  - add_docker_metadata: ~

output.logstash:
  hosts: ["logstash:5044"]
  ssl.certificate_authorities: ["/pki/ca.crt"]
  ssl.certificate: "/pki/filebeat.crt"
  ssl.key: "/pki/filebeat.key"

logging.level: warning
logging.to_stderr: true
http.enabled: false
