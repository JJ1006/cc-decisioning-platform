# Flatten the dead letter envelope. The original value is masked or redacted and truncated: it can hold a whole application.
filter {
  ruby {
    id => "dlq-transform"
    path => "/usr/share/logstash/ruby/cc_dlq.rb"
  }
  prune {
    whitelist_names => [
      "^@timestamp$", "^eventId$", "^correlationId$", "^producer$", "^topic$", "^source$", "^originalTopic$",
      "^originalPartition$", "^originalOffset$", "^originalKey$", "^originalValue$", "^errorClass$",
      "^errorMessage$", "^failedAt$", "^attempts$"
    ]
  }
}
