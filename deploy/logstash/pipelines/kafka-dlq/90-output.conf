output {
  elasticsearch {
    id => "dlq-out"
    hosts => ["https://elasticsearch:9200"]
    user => "logstash_writer"
    password => "${LOGSTASH_WRITER_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/pki/ca.crt"]
    index => "%{[@metadata][target_alias]}"
    document_id => "%{[eventId]}"
    action => "create"
    manage_template => false
    ilm_enabled => false
  }
}
