# Every <topic>.dlq written by the services (cc.dlq.v1 envelopes).
input {
  kafka {
    id => "dlq-in"
    bootstrap_servers => "kafka:9093"
    topics_pattern => "cc\..*\.dlq"
    metadata_max_age_ms => "30000"
    group_id => "logstash-dlq"
    client_id => "logstash-dlq"
    codec => "plain"
    decorate_events => "basic"
    auto_offset_reset => "earliest"
    enable_auto_commit => false
    isolation_level => "read_committed"
    security_protocol => "SSL"
    ssl_keystore_location => "/pki/keystore.p12"
    ssl_keystore_type => "PKCS12"
    ssl_keystore_password => "${KAFKA_STORE_PASSWORD}"
    ssl_truststore_location => "/pki/truststore.p12"
    ssl_truststore_type => "PKCS12"
    ssl_truststore_password => "${KAFKA_STORE_PASSWORD}"
  }
}
