# Decisions, audit and notification events from Kafka (mTLS, read_committed, at least once).
input {
  kafka {
    id => "events-in"
    bootstrap_servers => "${KAFKA_BOOTSTRAP:kafka:9093}"
    topics => [
      "cc.decisions.approved.v1", "cc.decisions.declined.v1", "cc.decisions.referred.v1",
      "cc.decisions.manual.v1", "cc.audit.v1", "cc.notifications.v1"
    ]
    group_id => "logstash-indexer"
    client_id => "logstash-events"
    codec => "plain"
    decorate_events => "basic"
    auto_offset_reset => "earliest"
    enable_auto_commit => false
    isolation_level => "read_committed"
    max_poll_records => "200"
    security_protocol => "SSL"
    ssl_keystore_location => "${KAFKA_KEYSTORE:/pki/keystore.p12}"
    ssl_keystore_type => "PKCS12"
    ssl_keystore_password => "${KAFKA_STORE_PASSWORD}"
    ssl_truststore_location => "${KAFKA_TRUSTSTORE:/pki/truststore.p12}"
    ssl_truststore_type => "PKCS12"
    ssl_truststore_password => "${KAFKA_TRUSTSTORE_PASSWORD}"
  }
}
