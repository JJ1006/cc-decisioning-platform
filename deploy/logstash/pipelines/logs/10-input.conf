# Filebeat over TLS with a client certificate (mTLS).
input {
  beats {
    id => "beats-in"
    port => 5044
    ssl_enabled => true
    ssl_certificate => "/pki/logstash.crt"
    ssl_key => "/pki/logstash.pk8.key"
    ssl_certificate_authorities => ["/pki/ca.crt"]
    ssl_client_authentication => "required"
  }
}
