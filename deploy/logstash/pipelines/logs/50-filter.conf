# Container logs. Our services log one JSON object per line (LogstashEncoder): lift level, correlationId,
# logger and trace ids to fields and label the service with its compose service name.
filter {
  json {
    id => "log-json"
    source => "message"
    tag_on_failure => ["_not_json"]
  }
  mutate {
    id => "log-service"
    copy => { "[container][labels][com_docker_compose_service]" => "service" }
    add_field => { "[@metadata][target_alias]" => "cc-logs-write" }
  }
  prune {
    whitelist_names => [
      "^@timestamp$", "^message$", "^level$", "^correlationId$", "^service$", "^logger_name$",
      "^thread_name$", "^stack_trace$", "^trace_id$", "^span_id$"
    ]
  }
}
