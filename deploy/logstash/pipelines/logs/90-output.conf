output {
  elasticsearch {
    id => "logs-out"
    hosts => ["${ES_URL:https://elasticsearch:9200}"]
    user => "logstash_writer"
    password => "${LOGSTASH_WRITER_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/pki/ca.crt"]
    index => "%{[@metadata][target_alias]}"
    action => "create"
    manage_template => false
    ilm_enabled => false
  }
}
